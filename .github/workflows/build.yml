name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install
        run: npm install --no-audit --no-fund

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          WIN_CERT: ${{ secrets.WIN_CSC_LINK }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CERT" ]; then
            export CSC_LINK="$WIN_CERT"
            export CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
          fi
          npx electron-builder --win nsis --x64 --publish never

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CSC_LINK }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT" ]; then
            export CSC_LINK="$MAC_CERT"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac dmg --universal --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Rung-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.dmg
